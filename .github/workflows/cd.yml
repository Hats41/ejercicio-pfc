name: CD de Ciclo Local
on:
  workflow_run:
    workflows: [CI de Ciclo Local]
    branches: [main, test]
    types: [completed]
permissions:
  deployments: read
  statuses: read
jobs:
  stage:
    name: Stage Preview y prueba HTTP
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'test' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Esperar Preview de Vercel para el commit
        id: preview
        run: |
          for attempt in $(seq 1 24); do
            url=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" --jq '.statuses[] | select(.context == "Vercel" and .state == "success") | .target_url' | head -1)
            if [ -n "$url" ]; then
              printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "Vercel no confirmó el despliegue de $SHA." >&2
          exit 1
      - name: Comprobar estado de Preview
        env:
          READY_URL: ${{ steps.preview.outputs.url }}
        run: |
          case "$READY_URL" in
            https://*.vercel.app/*|https://*.vercel.app) curl --fail --silent --show-error "$READY_URL" | grep -qi 'Ciclo' ;;
            https://vercel.com/*) echo "Vercel Ready para $SHA. El proveedor enlazó su panel de despliegue." ;;
            *) echo "URL inesperada del proveedor." >&2; exit 1 ;;
          esac
  production:
    name: Vercel producción y prueba pública
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Esperar confirmación de Vercel
        run: |
          for attempt in $(seq 1 24); do
            ready=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" --jq '[.statuses[] | select(.context == "Vercel" and .state == "success")] | length')
            if [ "$ready" = 1 ]; then exit 0; fi
            sleep 10
          done
          echo "Vercel no confirmó el despliegue de $SHA." >&2
          exit 1
      - name: Probar web pública y política de contenido
        run: |
          curl --fail --silent --show-error -D headers.txt -o home.html https://project-eku43.vercel.app/
          grep -qi 'Ciclo Local' home.html
          grep -qi '^content-security-policy:' headers.txt
